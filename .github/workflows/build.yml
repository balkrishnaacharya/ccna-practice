name: Build app across platforms

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g., v0.3.0)'
        required: true
        type: string

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri Desktop App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: 'CCNA Practice ${{ inputs.release_tag || github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  build-android:
    name: Build Android
    needs: build-desktop
    runs-on: ubuntu-latest
    environment: apk_key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Build Android app
        run: npm run tauri -- android build --apk --target aarch64

      - name: Sign and verify Android APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*release*.apk" ! -name "ccna-practice-*" | head -n 1)
          fi
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: No unsigned release APK found in build outputs!"
            find src-tauri/gen/android/app/build/outputs/ -maxdepth 5 || true
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
          KEYSTORE_FILE=$(mktemp /tmp/release-keystore.XXXXXX.jks)
          chmod 600 "$KEYSTORE_FILE"
          ALIGNED_APK=$(mktemp /tmp/aligned.XXXXXX.apk)
          trap 'rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"' EXIT

          FINAL_APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          mkdir -p "$FINAL_APK_DIR"
          TAG="${{ inputs.release_tag || github.ref_name }}"
          FINAL_APK="$FINAL_APK_DIR/ccna-practice-${TAG}-android-aarch64.apk"

          echo "$ANDROID_KEY_BASE64" | base64 -d > "$KEYSTORE_FILE"
          "$BUILD_TOOLS/zipalign" -v -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"

          if [ -n "${ANDROID_CERT_SHA256:-}" ]; then
            ACTUAL_FINGERPRINT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$FINAL_APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':\r\n ')
            EXPECTED_FINGERPRINT=$(echo "$ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':\r\n ')
            if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "ERROR: Certificate fingerprint mismatch!"
              exit 1
            fi
          fi
          rm -f "$UNSIGNED_APK"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/ccna-practice-*.apk
          if-no-files-found: error

  attach-android:
    name: Attach Android APK to Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bundle-android
          path: release-android

      - name: Attach Android APK via gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "Attaching Android APK to release tag: $TAG"
          gh release upload "$TAG" release-android/*.apk --clobber --repo "${{ github.repository }}"
          echo "✓ Android APK uploaded successfully!"

      - name: Verify release assets & updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag || github.ref_name }}"
          echo "Verifying complete release contents for tag: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets,isDraft,isPrerelease
          echo "✓ Release is complete, public, and stable!"