name: Build app across platforms

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new beta tag to publish after the builds pass
        required: false
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Verify updater artifacts exist
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          MANIFEST=$(find src-tauri/target/release/bundle -name "latest.json" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "ERROR: latest.json was NOT generated in the bundle directory!"
            echo "Ensure 'bundle.createUpdaterArtifacts' is set to true in tauri.conf.json and TAURI_SIGNING_PRIVATE_KEY is set."
            find src-tauri/target/release/bundle/ -maxdepth 4 || true
            exit 1
          fi
          echo "✓ Found updater manifest: $MANIFEST"
          SIG_COUNT=$(find src-tauri/target/release/bundle -name "*.sig" | wc -l)
          if [ "$SIG_COUNT" -eq 0 ]; then
            echo "ERROR: No .sig signature files found. The update manifest will be unverifiable."
            exit 1
          fi
          echo "✓ Found $SIG_COUNT .sig file(s)"

      - name: Verify updater artifacts exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Filter "latest.json" | Select-Object -First 1
          if (-not $manifest) {
            Write-Error "ERROR: latest.json was NOT generated. Ensure bundle.createUpdaterArtifacts is true in tauri.conf.json."
            exit 1
          }
          Write-Host "✓ Found updater manifest: $($manifest.FullName)"
          $sigs = Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Filter "*.sig"
          if ($sigs.Count -eq 0) {
            Write-Error "ERROR: No .sig files found."
            exit 1
          }
          Write-Host "✓ Found $($sigs.Count) .sig file(s)"

      - name: Upload build bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  android:
    name: Build on Android
    runs-on: ubuntu-latest
    environment: apk_key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Build Android app
        run: npm run tauri -- android build --apk --target aarch64

      - name: Sign and verify Android APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Locate unsigned APK
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk/ -type f -name "*release*.apk" ! -name "ccna-practice-*" | head -n 1)
          fi
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: No unsigned release APK found in build outputs!"
            find src-tauri/gen/android/app/build/outputs/ -maxdepth 5 || true
            exit 1
          fi
          echo "Found unsigned release APK at: $UNSIGNED_APK"

          # Fail-closed check: Secrets must be present to publish/sign APK
          if [ -z "${ANDROID_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "ERROR: Android signing secrets (ANDROID_KEY_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are missing for release build! Fail-closed."
              exit 1
            else
              echo "WARNING: Signing secrets not configured. Skipping signing on non-release branch."
              rm -f "$UNSIGNED_APK"
              exit 0
            fi
          fi

          if [ -z "${ANDROID_CERT_SHA256:-}" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "ERROR: ANDROID_CERT_SHA256 secret is required for release build! Fail-closed."
              exit 1
            else
              echo "WARNING: ANDROID_CERT_SHA256 not set. Skipping certificate fingerprint verification."
            fi
          fi

          # Discover Android build-tools dynamically
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ] || [ ! -x "$BUILD_TOOLS/zipalign" ] || [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "ERROR: Valid Android build-tools with zipalign and apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using Android build-tools at: $BUILD_TOOLS"

          KEYSTORE_FILE=$(mktemp /tmp/release-keystore.XXXXXX.jks)
          chmod 600 "$KEYSTORE_FILE"
          ALIGNED_APK=$(mktemp /tmp/aligned.XXXXXX.apk)
          trap 'rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"' EXIT

          FINAL_APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          mkdir -p "$FINAL_APK_DIR"
          FINAL_APK="$FINAL_APK_DIR/ccna-practice-${RELEASE_TAG}-android-aarch64.apk"

          # Decode keystore
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$KEYSTORE_FILE"

          # Zipalign unsigned APK
          echo "Aligning APK..."
          "$BUILD_TOOLS/zipalign" -v -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Sign APK
          echo "Signing APK with apksigner..."
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          # Cryptographic verification - Fail closed
          echo "Verifying signature with apksigner..."
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"

          # Verify certificate fingerprint identity if provided
          if [ -n "${ANDROID_CERT_SHA256:-}" ]; then
            echo "Verifying certificate SHA-256 fingerprint against expected fingerprint..."
            ACTUAL_FINGERPRINT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$FINAL_APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print tolower($NF)}' | tr -d ':\r\n ')
            EXPECTED_FINGERPRINT=$(echo "$ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':\r\n ')

            if [ -z "$ACTUAL_FINGERPRINT" ]; then
              echo "ERROR: Failed to extract SHA-256 digest from apksigner output!"
              exit 1
            fi

            if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "ERROR: Certificate fingerprint mismatch!"
              echo "Expected: $EXPECTED_FINGERPRINT"
              echo "Actual:   $ACTUAL_FINGERPRINT"
              exit 1
            fi
            echo "Certificate fingerprint verified: $ACTUAL_FINGERPRINT"
          fi

          # Remove original unsigned APK to prevent accidental upload
          rm -f "$UNSIGNED_APK"

          echo "Successfully created and cryptographically verified: $FINAL_APK"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/ccna-practice-*.apk
          if-no-files-found: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && 'error' || 'warn' }}

  release:
    name: Publish beta release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Remove non-installer files from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                case "$asset" in
                  *.AppImage|*.deb|*.rpm|*.msi|*.exe|*android*.apk) ;;
                  *) gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
                esac
              done
          fi

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: app-bundle-*
          path: release-assets
          merge-multiple: true

      - name: Assert latest.json is present (fail loudly if missing)
        run: |
          set -euo pipefail
          MANIFEST=$(find release-assets -name "latest.json" | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "FATAL: latest.json not found in downloaded build artifacts!"
            echo "This means the build job did not generate updater artifacts."
            echo "Check that bundle.createUpdaterArtifacts=true in tauri.conf.json"
            echo "and that TAURI_SIGNING_PRIVATE_KEY is set as a secret."
            echo ""
            echo "Files found in release-assets/:"
            find release-assets/ -type f | sort || true
            exit 1
          fi
          echo "✓ latest.json confirmed at: $MANIFEST"
          SIG_COUNT=$(find release-assets -name "*.sig" | wc -l)
          echo "✓ Total .sig files: $SIG_COUNT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CCNA Practice ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/**/latest.json
            release-assets/**/*.sig
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*-android-*.apk
            release-assets/*-android-*.apk
