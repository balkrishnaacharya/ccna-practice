name: Build app across platforms

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new beta tag to publish after the builds pass
        required: false
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app
        run: npm run tauri -- build

      - name: Upload build bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  android:
    name: Build on Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Build Android app
        run: npm run tauri -- android build --apk --target aarch64

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-android
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

  release:
    name: Publish beta release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Remove non-installer files from an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                case "$asset" in
                  *.AppImage|*.deb|*.rpm|*.msi|*.exe|*.apk) ;;
                  *) gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
                esac
              done
          fi

      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: app-bundle-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CCNA Practice ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.apk
